name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Enable corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The autonomous agent runs pnpm ci:agent before pushing. Keep hosted
      # PR checks small; release-readiness retains the complete hosted suite.
      - name: Validate dependency licenses
        run: pnpm deps:licenses

      - name: Lint and typecheck
        run: pnpm lint && pnpm typecheck

      - name: Verify autonomy and merge gates
        run: pnpm exec vitest run tests/native-lifecycle.test.ts tests/native-required-ci.test.ts tests/native-repair.test.ts tests/native-promotion-mode.test.ts --fileParallelism=false
